[project]
name = "scuba-oscal"
version = "0.1.0"
description = "AI-powered SCuBA to OSCAL compliance pipeline for Microsoft 365"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.25.1",
    "regex==2026.9.10",
    "python-dotenv==1.1.1",
    # agents/tools.py annotates tool parameters with pydantic Field so the
    # agent framework can derive tool schemas. It is a core dependency, not
    # an AI-extra one: the tool layer is importable and testable without Azure.
    "pydantic==2.12.3",
    # exemptions.py reads ScubaGear's YAML configuration. Like pydantic, this
    # arrived transitively via the AI extra in development and was invisible
    # until CI (which installs only [dev]) failed on it.
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
ai = [
    "agent-framework-foundry>=1.13.1",
    "agent-framework-orchestrations>=1.2.0",
    "azure-identity>=1.25.3",
]
search = [
    # Optional: semantic retrieval over baseline guidance. The tool layer
    # falls back to keyword search when this is absent, so it is never
    # required for the pipeline or the tests to pass.
    "azure-search-documents==11.6.0",
    "openai>=3.0",
]
app = [
    "streamlit==1.52.2",
    "pandas==2.3.3",
    "plotly==6.5.0",
]
dev = ["pytest==9.0.1", "ruff==0.16.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: `str, Enum` -> `StrEnum` would change str() semantics (StrEnum
# returns the value, (str, Enum) returns "Class.MEMBER"). Not worth the
# behavioural risk for a stylistic gain.
ignore = ["E501", "UP042"]
